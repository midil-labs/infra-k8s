midil:
  serviceName: notification
  platform: onekg
  replicaCount: 3

  image:
    registry: ghcr.io/midil-labs
    service: onekg-notification-api
    tag: 0.1.0.dev2@sha256:83eb055e7b7e93949ede5fa953830f67c18f43b7f1ef049ad13609dc83063f0a
    pullSecrets:
      - name: ghcr-secret
    createPullSecret: false
    pullSecretName: ghcr-secret

  ingressRoute:
    enabled: true
    host: "onekg.midil.io"
    entryPoints: ["websecure"]
    route:
      pathPrefix: "/apis/v1/notification"
      servicePort: 80
    tls:
      enabled: true
      secretName: "onekg-midil-io-tls"


  cors:
    enabled: false

  service:
    http:
      targetPort: 7000

  probes:
    enabled: false
    liveness:
      port: 7000
      path: /docs
    readiness:
      port: 7000
      path: /docs
    startup:
      port: 7000

  autoscaling:
    enabled: false